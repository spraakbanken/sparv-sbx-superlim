id: sbx-swe-migration_stance-transformers-superlim2
parent: sbx-swe-superlim-parent
short_description:
  swe: Annoterar inställning gentemot immigration på en skala
  eng: Label the sentiment towards immigration on a continuous scale
task: migration stance
type: analysis
analysis_unit: sentence
annotations:
  - <sentence>:sbx_superlim.migration_stance
example_output: |-
  ```xml
  <sentence migration_stance="4.854378700256348">
    <token>Ett</token>
    <token>öppet</token>
    <token>Sverige</token>
    <token>Vi</token>
    <token>lever</token>
    <token>i</token>
    <token>en</token>
    <token>orolig</token>
    <token>tid</token>
    <token>,</token>
    <token>där</token>
    <token>människor</token>
    <token>tvingas</token>
    <token>fly</token>
    <token>för</token>
    <token>sina</token>
    <token>liv</token>
    <token>från</token>
    <token>krig</token>
    <token>och</token>
    <token>förtryck</token>
    <token>.</token>
  </sentence>
  <sentence migration_stance="3.4953160285949707">
    <token>Inte</token>
    <token>sedan</token>
    <token>Andra</token>
    <token>världskriget</token>
    <token>har</token>
    <token>så</token>
    <token>många</token>
    <token>människor</token>
    <token>varit</token>
    <token>på</token>
    <token>flykt</token>
    <token>.</token>
  </sentence>
  ```
models:
  - name: "Svensk ABSAbank-Imm 1.1"
    url: "https://spraakbanken.gu.se/resurser/absabank-imm"
    description: "Also see https://huggingface.co/datasets/sbx/superlim-2"
    license: CC-BY 4.0
